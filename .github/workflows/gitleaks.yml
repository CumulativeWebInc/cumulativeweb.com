# CWI LANE 1 — security hardening (2026-10-02)
# Runs gitleaks on every push and PR so leaked secrets are caught before merge.
name: gitleaks

on:
  push:
    paths-ignore:
      # Machine-written data/state — no secret-bearing capacity. Skips the
      # scan on data-only pushes (radio now-playing + freshness heartbeat are
      # the Actions-minute burners). Code/config pushes still scan.
      - 'radio/now-playing.json'
      - 'data/freshness.json'
  pull_request:
  schedule:
    # Weekly full-history safety net — catches anything the path filter skipped.
    - cron: '0 6 * * 1'

# Rapid scheduler pushes (now-playing every ~2 min) used to pile up overlapping
# scans that GitHub cancelled and emailed as "failures". One run per ref now —
# a newer push cleanly supersedes the older one, no failure noise.
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
