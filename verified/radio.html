<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>✓ Radio 365 — Live Attestation</title>
<meta name="description" content="Continuous proof that Radio 365 is broadcasting live. Cumulative Web Inc 24/7 stream.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:linear-gradient(135deg,#0a0a0a 0%,#1a0a0a 50%,#0a0a0a 100%);color:#e8e8e8;min-height:100vh}
.hero{text-align:center;padding:4rem 1rem 2rem}
.hero h1{font-size:2.5rem;background:linear-gradient(90deg,#f87171,#fb923c,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.hero p{color:#fca5a5;font-size:1.1rem}
.live-dot{display:inline-block;width:12px;height:12px;background:#f87171;border-radius:50%;margin-right:8px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.badge{display:inline-block;background:rgba(248,113,113,.15);border:1px solid #f87171;color:#f87171;padding:.5rem 1.5rem;border-radius:2rem;font-weight:600;margin:1rem 0;font-size:1.1rem}
.badge.fail{background:rgba(248,113,113,.15);border-color:#f87171;color:#f87171}
.badge.ok{background:rgba(74,222,128,.15);border-color:#4ade80;color:#4ade80}
.now-playing{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:16px;padding:2rem;margin:2rem auto;max-width:600px}
.now-playing h2{color:#fca5a5;font-size:.9rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:.5rem}
.now-playing .track{font-size:1.5rem;color:#fff;font-weight:700}
.grid{max-width:900px;margin:0 auto;padding:2rem 1rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.card{background:rgba(248,113,113,.05);border:1px solid rgba(248,113,113,.15);border-radius:12px;padding:1.5rem;backdrop-filter:blur(10px)}
.card h3{color:#fff;margin-bottom:.5rem;font-size:1rem}
.check{color:#4ade80}.cross{color:#f87171}
footer{text-align:center;padding:2rem;color:#555;font-size:.85rem}
footer a{color:#f87171}
.timestamp{color:#888;font-size:.9rem;margin-top:.5rem}
pre{background:#111;border-radius:8px;padding:1rem;overflow-x:auto;font-size:.75rem;max-width:900px;margin:1rem auto;color:#fecaca}
.btn{display:inline-block;background:linear-gradient(90deg,#f87171,#fb923c);color:#000;font-weight:700;padding:.75rem 2rem;border-radius:2rem;text-decoration:none;margin:1rem .5rem}
audio{width:100%;max-width:600px;margin:1rem auto;display:block}
</style>
</head>
<body>
<div class="hero">
<h1><span class="live-dot"></span>RADIO 365</h1>
<p>Cumulative Web Inc · 24/7 Stream</p>
<div class="badge ok" id="badge">● CHECKING…</div>
<p class="timestamp" id="ts">—</p>
<div class="now-playing">
<h2>♪ Now Playing</h2>
<div class="track" id="nowplaying">Loading…</div>
</div>
<div>
<a class="btn" href="https://cwi-radio-mp3-bridge.onrender.com/stream.mp3">▶ Listen Live (MP3)</a>
</div>
<audio controls preload="none" src="https://cwi-radio-mp3-bridge.onrender.com/stream.mp3"></audio>
</div>
<div class="grid" id="grid"><p style="text-align:center;color:#666">Loading verification…</p></div>
<div style="max-width:900px;margin:0 auto;padding:0 1rem">
<h3 style="color:#fff;margin-bottom:.5rem">Machine-readable receipt</h3>
<p style="color:#888;font-size:.9rem;margin-bottom:.5rem">AI agents: fetch <a href="/verified/radio-receipt.json" style="color:#f87171"><code>/verified/radio-receipt.json</code></a></p>
<pre id="receipt">Loading…</pre>
</div>
<footer>
<p>Attested by <code>CWI-Attest/1.0</code> · <a href="/verified/">All attestations</a> · <a href="/radio/">Radio page</a></p>
</footer>
<script>
fetch('/verified/radio-receipt.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
  const b=document.getElementById('badge');
  b.textContent=d.all_pass?'● ON AIR':'● ISSUES DETECTED';
  b.className='badge '+(d.all_pass?'ok':'fail');
  document.getElementById('ts').textContent='Certified: '+d.certified_at;
  document.getElementById('nowplaying').textContent=d.now_playing||'—';
  document.getElementById('grid').innerHTML=Object.entries(d.checks).map(([k,v])=>
    `<div class="card"><h3><span class="${v?'check':'cross'}">${v?'✓':'✗'}</span> ${k.replace(/_/g,' ')}</h3></div>`
  ).join('');
  document.getElementById('receipt').textContent=JSON.stringify(d,null,2);
}).catch(e=>{document.getElementById('badge').textContent='● RECEIPT UNAVAILABLE';document.getElementById('badge').className='badge fail';});
</script>
</body>
</html>
